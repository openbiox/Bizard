name: CI probe B

# TEMPORARY diagnostic (remove with probe A). Reacts to probe A's
# completion and posts two comments from the workflow_run context —
# the exact pattern pr-review-comment.yml uses — to bisect the 403:
#   1. comment on closed PR #344 (the failing call shape)
# Both failures are caught so one never masks the other.

on:
  workflow_run:
    workflows: [CI probe A]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const call = (issue, body) => github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue, body,
            });
            for (const [label, issue] of [['PR 344', 344]]) {
              try {
                await call(issue, '🔍 probe B (workflow_run, issues:write + pull-requests:write) — ' + label);
                core.info(label + ' comment: OK');
              } catch (e) {
                core.warning(label + ' comment FAILED: ' + e.status + ' ' + e.message);
              }
            }
