on:
  pull_request:
    branches: [main, master]

name: Render the new Quarto files

# https://github.com/r-lib/actions/tree/v2/examples#render-rmarkdown
# https://github.com/quarto-dev/quarto-actions
#
# Runs on the safe `pull_request` event, so the token is read-only for
# fork PRs and untrusted PR code (checked out and rendered in job 2) never
# executes with write access or secrets. The PR comments that need a
# writable token are posted by the companion `pr-review-comment.yml`
# workflow, which reacts to this workflow's completion in the trusted
# default-branch context.

env:
  RUST_BACKTRACE: 1

jobs:
  # ── Job 1: Format check ────────────────────────────────────────────────────
  # Security note: Uses only the GitHub API to read changed file contents;
  # NO checkout of untrusted PR code occurs in this job. It also derives
  # the changed-QMD list so job 2 can be skipped entirely for PRs that
  # touch no tutorial files.
  format-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      any_qmd_changed: ${{ steps.format-check.outputs.any_qmd_changed }}
      qmd_files: ${{ steps.format-check.outputs.qmd_files }}
    steps:
      - name: Detect changed QMD files and run format check
        id: format-check
        uses: actions/github-script@v9
        with:
          script: |
            // ── Get list of changed files in the PR ───────────────────────
            const { data: files } = await github.rest.pulls.listFiles({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page:    100,
            });

            // Render gate for job 2: any added/modified/renamed QMD counts,
            // zh files included (mirrors the previous tj-actions/changed-files
            // behavior). Validated files below are the stricter subset.
            const renderable = files.filter(f =>
              f.filename.toLowerCase().endsWith('.qmd') &&
              f.status !== 'removed'
            );
            core.setOutput('any_qmd_changed', String(renderable.length > 0));
            core.setOutput('qmd_files', renderable.map(f => f.filename).join(' '));

            const fs = require('fs');
            fs.mkdirSync('pr-review-meta', { recursive: true });
            // The workflow_run commenter reads the PR number from this artifact,
            // because workflow_run's pull_requests array is empty for fork PRs.
            fs.writeFileSync('pr-review-meta/pr-number', String(context.payload.pull_request.number));

            const qmdFiles = files.filter(f =>
              (f.filename.endsWith('.qmd') || f.filename.endsWith('.Qmd')) &&
              !f.filename.endsWith('.zh.qmd') &&
              f.status !== 'removed' &&
              f.filename.includes('/')   // exclude root-level QMD files (site navigation pages)
            );

            if (qmdFiles.length === 0) {
              fs.writeFileSync(
                'pr-review-meta/format-comment.md',
                '## ✅ QMD Format Check\n\nNo new QMD tutorial files to check.\n'
              );
              return;
            }

            // ── Validation helpers ────────────────────────────────────────
            const REQUIRED_YAML_FIELDS = ['title', 'author'];
            const REQUIRED_SECTIONS    = ['## Example', '## Setup', '## Data Preparation', '## Visualization'];

            const errors   = {};
            const warnings = {};

            for (const f of qmdFiles) {
              let content;
              try {
                const { data: blob } = await github.rest.repos.getContent({
                  owner:   context.repo.owner,
                  repo:    context.repo.repo,
                  path:    f.filename,
                  ref:     context.payload.pull_request.head.sha,
                });
                content = Buffer.from(blob.content, 'base64').toString('utf8');
              } catch (e) {
                console.log(`Could not fetch ${f.filename}: ${e.message}`);
                continue;
              }

              const fp = f.filename;
              const fileErrors   = [];
              const fileWarnings = [];

              // 1. YAML frontmatter
              const yamlMatch = content.match(/^---\s*\n([\s\S]*?)\n---/);
              if (!yamlMatch) {
                fileErrors.push('Missing YAML frontmatter (expected `---` block at top)');
              } else {
                const yaml = yamlMatch[1];
                for (const field of REQUIRED_YAML_FIELDS) {
                  if (!new RegExp(`^${field}\\s*:`, 'm').test(yaml)) {
                    fileErrors.push(`Missing required YAML field: \`${field}\``);
                  }
                }
              }

              // 2. Required sections
              for (const section of REQUIRED_SECTIONS) {
                if (!content.includes(section)) {
                  fileWarnings.push(`Missing recommended section: \`${section}\``);
                }
              }

              // 3. Figure code blocks should have labels
              const codeBlockRe = /```\{r([^}]*)\}([\s\S]*?)```/g;
              let m;
              while ((m = codeBlockRe.exec(content)) !== null) {
                const opts = m[1], body = m[2];
                // Accept labels in both the old {r label, ...} header form
                // and the Quarto YAML-options "#| label:" form inside the body
                const hasLabel = opts.includes('label') || body.includes('#| label:');
                if ((body.includes('fig-cap') || body.includes('#| fig-cap:')) && !hasLabel) {
                  const lineNo = content.slice(0, m.index).split('\n').length;
                  fileWarnings.push(`Code block near line ${lineNo} has \`fig-cap\` but no \`label\``);
                }
              }

              // 4. Demo image
              if (!content.includes('![')) {
                fileWarnings.push('No demo image found (recommended: `![](../images/...)`)');
              }

              if (fileErrors.length)   errors[fp]   = fileErrors;
              if (fileWarnings.length) warnings[fp] = fileWarnings;
            }

            // ── Build summary ──────────────────────────────────────────────
            const hasErrors = Object.keys(errors).length > 0;
            const lines = [];

            if (hasErrors) {
              lines.push('### ❌ Format Errors (must fix)');
              for (const [fp, errs] of Object.entries(errors)) {
                lines.push(`\n**\`${fp}\`**`);
                errs.forEach(e => lines.push(`- ${e}`));
              }
            }
            if (Object.keys(warnings).length > 0) {
              lines.push('\n### ⚠️ Format Warnings (recommended)');
              for (const [fp, warns] of Object.entries(warnings)) {
                lines.push(`\n**\`${fp}\`**`);
                warns.forEach(w => lines.push(`- ${w}`));
              }
            }
            if (!hasErrors && Object.keys(warnings).length === 0) {
              lines.push(`### ✅ All ${qmdFiles.length} checked QMD file(s) pass format validation!`);
            }

            const summary = lines.join('\n');
            const icon    = hasErrors ? '❌' : '✅';

            const body = `## ${icon} QMD Format Check\n\n${summary}\n\n` +
              `> Automated check by the [PR Review workflow]` +
              `(${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).\n` +
              `> See [contribution guidance](../blob/main/Template/visualization_guidance_EN.qmd) for the expected tutorial format.`;

            fs.writeFileSync('pr-review-meta/format-comment.md', body);

            if (hasErrors) core.setFailed('QMD format errors found');

      - name: Upload format summary for the comment poster
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: format-summary
          path: pr-review-meta
          if-no-files-found: ignore

  # ── Job 2: Render preview ──────────────────────────────────────────────────
  # Only runs when the PR actually changes QMD files; PRs touching only
  # CSVs, config, or docs skip the ~35 min environment setup entirely.
  # PR comments are posted by pr-review-comment.yml (this job's token is
  # read-only on fork PRs).
  build-deploy:
    runs-on: ubuntu-latest
    needs: format-check
    if: ${{ !failure() && needs.format-check.outputs.any_qmd_changed == 'true' }}
    concurrency:
      group: pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      QMD_FILES: ${{ needs.format-check.outputs.qmd_files }}
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # The composite action below is referenced from the merge ref, not
      # from the PR head: a PR branch that predates the action (added in
      # #336, 2026-10-13) would otherwise fail with "Can't find action.yml"
      # even though this check has nothing to do with the action itself.
      # PRs that deliberately modify the action are exercised after merge,
      # on main. The sparse checkout downloads only the action directory.
      - name: Checkout shared CI actions (from the merge ref)
        uses: actions/checkout@v7
        with:
          path: .ci-actions
          sparse-checkout: |
            .github/actions
          persist-credentials: false

      # ── Render environment (shared composite action, issue #306 B1) ──
      # Replaces the previous setup-r-dependencies run (measured 28.0 min:
      # full 703-package DESCRIPTION resolution with ~90 Bioconductor
      # source builds, cache deliberately off here - see the history of
      # this block - because PR-scope library caches would blow the
      # repo-wide 10 GB cache pool). setup-render-env uses the renv.lock
      # cache that main-branch builds maintain, keyed on the lockfile
      # hash: restore-only on PRs (never saved), so the pool keeps only
      # main-branch entries. Measured on the same commit: renv::restore()
      # "Successfully installed 693 packages in 1.9 seconds"; whole env
      # setup ~6 min instead of ~29.
      - name: Set up render environment
        id: setup-env
        uses: ./.ci-actions/.github/actions/setup-render-env
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          # Julia is handled by this workflow's own conditional steps
          # further down (same behavior as before this change); the
          # action's Julia setup stays off. julia_frozen: 1 is what turns
          # the "force Julia" branch of the action off.
          need_julia: 'false'
          julia_frozen: '1'
          julia_missing: 'false'

      - uses: julia-actions/setup-julia@v3
        if: contains(needs.format-check.outputs.qmd_files, 'Julia/')

      - name: Instantiate Julia render env
        if: contains(needs.format-check.outputs.qmd_files, 'Julia/')
        run: |
          # QuartoNotebookRunner activates the file-adjacent Project.toml
          # but never installs packages; the copied working-dir env needs a
          # resolved Manifest before any {julia} notebook renders there.
          mkdir -p _QMD_RENDER_WORKING_DIR/Julia
          cp Julia/Project.toml _QMD_RENDER_WORKING_DIR/Julia/
          julia --project="$PWD/_QMD_RENDER_WORKING_DIR/Julia" -e 'using Pkg; Pkg.instantiate()'

      # Python (3.11 + pip-cached requirements.txt) is installed by
      # setup-render-env for every PR, so the conditional setup-python
      # block this workflow used to carry is gone.

      - name: Scan .qmd for dependencies and update
        run: Rscript update-dependencies.R

      # Mirrors quarto-publish.yml: the scan above may append QMD-discovered
      # packages to DESCRIPTION that are newer than renv.lock, so renv did
      # not install them. Delta-install just the difference against the
      # lockfile before anything renders. No-op on a typical run.
      - name: Install scan-added dependencies (delta)
        run: |
          Rscript - <<'RS'
          dcf <- read.dcf("DESCRIPTION")
          imports <- if ("Imports" %in% colnames(dcf)) {
            x <- trimws(strsplit(dcf[1, "Imports"], ",")[[1]])
            gsub("\\(.*$", "", x)
          } else character(0)
          remotes_field <- if ("Remotes" %in% colnames(dcf)) {
            trimws(strsplit(dcf[1, "Remotes"], ",")[[1]])
          } else character(0)
          # Remote refs (user/repo) are handled by renv from the Remotes
          # field of the packages renv restores, not installed directly.
          imports <- setdiff(imports[imports != "" & imports != "R"], "R")
          missing <- imports[!vapply(imports, function(p)
            requireNamespace(p, quietly = TRUE), logical(1))]
          if (length(missing) == 0) {
            message("All Imports loadable - no delta install needed.")
          } else {
            message("Delta-installing: ", paste(missing, collapse = ", "))
            # renv's autoloader (renv::load()) replaced .libPaths() with the
            # project library only, hiding pak from R_LIBS_USER - bootstrap
            # it into the (writable) project library if missing, same
            # pattern as quarto-publish.yml and ci-benchmark.yml (PPM
            # binary, ~seconds).
            if (!requireNamespace("pak", quietly = TRUE))
              install.packages("pak")
            pak::pak(missing)
          }
          RS

      - name: Render the new quarto files
        # The render runs from _QMD_RENDER_WORKING_DIR (no renv autoloader
        # there), so R_LIBS must point at the restored project library -
        # same wiring as .github/actions/render-site (incident
        # 38093942045: LibPaths = [R_LIBS_USER, /opt/R/...], "knitr: (None)").
        env:
          R_LIBS: ${{ steps.setup-env.outputs.lib-path }}
        run: |
          # every qmd file should be self-contained
          mkdir -p _QMD_RENDER_REVIEW
          mkdir -p _QMD_RENDER_WORKING_DIR
          for file in ${QMD_FILES}; do
            myfile=$(basename "$file")
            myname="${myfile%.*}" # remove file extension
            mkdir -p "_QMD_RENDER_REVIEW/$myname"
            # keep the language subdir: same-named tutorials exist under
            # Python/ and Julia/, and the julia-engine resolves its env
            # from the Project.toml sitting next to the qmd
            mkdir -p "_QMD_RENDER_WORKING_DIR/$(dirname "$file")"
            cp "$file" "_QMD_RENDER_WORKING_DIR/$file"
            if [ "$(dirname "$file")" = "Julia" ] && [ -f Julia/Project.toml ]; then
              cp Julia/Project.toml "_QMD_RENDER_WORKING_DIR/Julia/"
            fi
            echo "Rendering $file"
            quarto render "_QMD_RENDER_WORKING_DIR/$file" --execute-dir .
            mv "_QMD_RENDER_WORKING_DIR/$file" "_QMD_RENDER_REVIEW/$myname/"
          done

      - name: Upload Quarto artifacts
        uses: actions/upload-artifact@v7
        id: artifact-upload
        with:
          name: quarto-rendered-files
          path: _QMD_RENDER_REVIEW
          if-no-files-found: "ignore"
