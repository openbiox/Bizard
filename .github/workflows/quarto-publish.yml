# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Github Page – Optimized Build & Deploy                             ║
# ║                                                                      ║
# ║  Key optimizations over the original workflow:                       ║
# ║  1. FREEZE CACHE FIX: babelquarto renders in a temp dir and only    ║
# ║     copies _site back – the _freeze it creates is discarded. We     ║
# ║     pre-render all non-frozen files first so that workspace _freeze  ║
# ║     is fully populated before babelquarto copies it to its temp dir. ║
# ║     This turns a ~90 min render into ~20 min on subsequent runs.    ║
# ║  2. CHANGED-FILE DETECTION: Detects which QMDs changed and only     ║
# ║     pre-renders those files, enabling fail-fast (catch errors in     ║
# ║     ~2 min instead of ~90 min).                                      ║
# ║  3. CONDITIONAL JULIA SETUP: Skips the ~9 min Julia installation    ║
# ║     when freeze already covers Julia files and none changed.         ║
# ║  4. SMART CONCURRENCY: Groups by PR number or branch so updated     ║
# ║     pushes cancel stale in-progress builds.                          ║
# ║  5. RESOURCE CONSERVATION: Failed builds still save their freeze    ║
# ║     progress, so the next run picks up where it left off.            ║
# ║  6. RENV LOCKFILE INSTALLS (issue #306, B1): R dependencies come    ║
# ║     from renv.lock via setup-renv, cache keyed on the lockfile      ║
# ║     hash — an unchanged lockfile restores in minutes instead of a   ║
# ║     ~26 min pak resolution + install.                               ║
# ╚══════════════════════════════════════════════════════════════════════╝

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'DESCRIPTION'
      - 'requirements.txt'
      - 'Julia/**'
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/auto-translate.yml'
      - '.github/workflows/generate-skills.yml'
      - '.github/workflows/mcp-bundle.yml'
      - '.github/workflows/compress-images.yml'
      - '.github/workflows/generate-skills.yml'
      - '.github/workflows/skill-command.yml'
      - '.github/workflows/translate-command.yml'
      - '**/*.zh.qmd'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'DESCRIPTION'
      - 'requirements.txt'
      - 'Julia/**'
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/auto-translate.yml'
      - '.github/workflows/generate-skills.yml'
      - '.github/workflows/mcp-bundle.yml'
      - '.github/workflows/compress-images.yml'
      - '.github/workflows/generate-skills.yml'
      - '.github/workflows/skill-command.yml'
      - '.github/workflows/translate-command.yml'
      - '**/*.zh.qmd'
  workflow_dispatch:
    inputs:
      force_full_rebuild:
        description: 'Force full rebuild (delete freeze cache and re-execute all files)'
        type: boolean
        default: false

name: Github Page

env:
  RUST_BACKTRACE: 1

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Group by PR number for PRs, by branch ref for pushes.
    # New pushes/commits cancel the previous in-progress build in the same group.
    concurrency:
      group: quarto-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TMP_DIR: /mnt/TMP
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # Shallow checkout (issue #306, B5): the change-detection step
          # below needs only the base commit, which it fetches on demand.
          # Full history costs ~1 min of checkout against a ~5 GB .git.
          fetch-depth: 1

      # ── Detect changed files ─────────────────────────────────
      # Determines which QMDs changed so we can:
      #  (a) pre-render only those files (fail-fast)
      #  (b) skip Julia/Python setup when unnecessary
      - name: Detect changed QMD files
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA=""
          fi

          # Handle first push, force push, or manual dispatch
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed_qmds=" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "need_julia=true" >> "$GITHUB_OUTPUT"
            echo "need_python=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No base SHA available – treating as full build"
            exit 0
          fi

          # Shallow checkout (issue #306, B5): fetch just the base commit so
          # the diff below has both endpoints. Fails soft – on error (e.g.
          # the base commit was force-pushed away) fall back to a full build.
          if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            echo "⚠️ Could not fetch base $BASE_SHA – treating as full build"
            echo "changed_qmds=" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "need_julia=true" >> "$GITHUB_OUTPUT"
            echo "need_python=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_QMDS=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.qmd' 2>/dev/null | tr '\n' ' ' || echo "")
          echo "changed_qmds=$CHANGED_QMDS" >> "$GITHUB_OUTPUT"

          if [ -n "$CHANGED_QMDS" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

          JULIA_CHANGED=$(echo "$CHANGED_QMDS" | grep -c 'Julia/' || true)
          PYTHON_CHANGED=$(echo "$CHANGED_QMDS" | grep -c 'Python/' || true)
          echo "need_julia=$( [ "$JULIA_CHANGED" -gt 0 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
          echo "need_python=$( [ "$PYTHON_CHANGED" -gt 0 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

          echo "📋 Changed QMDs: ${CHANGED_QMDS:-none}"
          echo "   Julia changes: $JULIA_CHANGED | Python changes: $PYTHON_CHANGED"

      # ── Restore freeze cache (CRITICAL for performance) ──────
      # The freeze cache stores pre-computed knitr outputs for all QMD files.
      # It is populated by the "Pre-render all non-frozen QMD files" step
      # (which writes directly to the workspace _freeze directory), NOT by
      # babelquarto itself (babelquarto renders in a temp dir and never
      # syncs _freeze back to the workspace).
      #
      # Key strategy:
      #   - Primary key includes commit SHA (unique per commit)
      #   - run_attempt in the key ensures retries create a new cache entry
      #     (cache entries are immutable). Retries still restore from the
      #     previous attempt via the restore-keys prefix match.
      #   - restore-keys prefix ensures we always get the latest cache
      #   - A separate save step (with if: always()) preserves progress
      #     even when the build fails partway through
      - name: Restore freeze cache
        id: freeze-restore
        if: inputs.force_full_rebuild != true
        uses: actions/cache/restore@v6
        with:
          path: _freeze
          key: freeze-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            freeze-${{ runner.os }}-${{ github.sha }}-
            freeze-${{ runner.os }}-

      - name: Clear freeze for forced full rebuild
        if: inputs.force_full_rebuild == true
        run: rm -rf _freeze

      - name: Report freeze cache status
        id: freeze-check
        run: |
          if [ -d "_freeze" ]; then
            FREEZE_COUNT=$(find _freeze -name "*.json" -type f 2>/dev/null | wc -l)
            echo "✅ Freeze cache available: $FREEZE_COUNT frozen output(s)"
            echo "has_freeze=true" >> "$GITHUB_OUTPUT"

            # Check per-language coverage
            JULIA_FROZEN=$(find _freeze -path "*/Julia/*" -name "*.json" 2>/dev/null | wc -l)
            PYTHON_FROZEN=$(find _freeze -path "*/Python/*" -name "*.json" 2>/dev/null | wc -l)
            echo "julia_frozen=$JULIA_FROZEN" >> "$GITHUB_OUTPUT"
            echo "python_frozen=$PYTHON_FROZEN" >> "$GITHUB_OUTPUT"
            echo "   Julia frozen: $JULIA_FROZEN | Python frozen: $PYTHON_FROZEN"

            # Per-file coverage: a Julia tutorial with no freeze entry will
            # be executed live during the full render, which requires the
            # Julia environment even when no Julia qmd changed in this diff
            JULIA_MISSING=false
            for qmd in Julia/*.qmd; do
              base="$(basename "$qmd" .qmd)"
              if ! find _freeze -path "*/Julia/${base}/*" -name "*.json" 2>/dev/null | grep -q .; then
                JULIA_MISSING=true
                echo "   ⚠️ no freeze entry for $qmd"
              fi
            done
            echo "julia_missing=$JULIA_MISSING" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ No freeze cache – full execution required"
            echo "has_freeze=false" >> "$GITHUB_OUTPUT"
            echo "julia_frozen=0" >> "$GITHUB_OUTPUT"
            echo "python_frozen=0" >> "$GITHUB_OUTPUT"
            echo "julia_missing=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Render environment (shared composite action) ─────────
      - name: Set up render environment
        id: setup-env
        uses: ./.github/actions/setup-render-env
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          need_julia: ${{ steps.changes.outputs.need_julia }}
          julia_frozen: ${{ steps.freeze-check.outputs.julia_frozen }}
          julia_missing: ${{ steps.freeze-check.outputs.julia_missing }}
          force_full_rebuild: ${{ inputs.force_full_rebuild }}

      # ── Dependency Scanning ──────────────────────────────────
      - name: Scan and update dependencies
        run: |
          Rscript update-dependencies.R
          python manage-dependencies.py --update

      # The scan above appends QMD-discovered install-call packages to
      # DESCRIPTION, but those are newer than renv.lock, so renv::restore()
      # did not install them.  Delta-install just the difference against
      # the lockfile before anything renders.  No-op on a typical run.
      - name: Install scan-added dependencies (delta)
        run: |
          Rscript - <<'RS'
          dcf <- read.dcf("DESCRIPTION")
          imports <- if ("Imports" %in% colnames(dcf)) {
            x <- trimws(strsplit(dcf[1, "Imports"], ",")[[1]])
            gsub("\\(.*$", "", x)
          } else character(0)
          remotes_field <- if ("Remotes" %in% colnames(dcf)) {
            trimws(strsplit(dcf[1, "Remotes"], ",")[[1]])
          } else character(0)
          # Remote refs (user/repo) are handled by renv from the Remotes
          # field of the packages renv restores, not installed directly.
          imports <- setdiff(imports[imports != "" & imports != "R"], "R")
          missing <- imports[!vapply(imports, function(p)
            requireNamespace(p, quietly = TRUE), logical(1))]
          if (length(missing) == 0) {
            message("All Imports loadable - no delta install needed.")
          } else {
            message("Delta-installing: ", paste(missing, collapse = ", "))
            # renv's autoloader (renv::load()) replaced .libPaths() with the
            # project library only, hiding pak from R_LIBS_USER — bootstrap
            # it into the (writable) project library if missing, same
            # pattern as ci-benchmark.yml (PPM binary, ~seconds).
            if (!requireNamespace("pak", quietly = TRUE))
              install.packages("pak")
            pak::pak(missing)
          }
          RS

      - name: Commit updated dependency files
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add DESCRIPTION requirements.txt Julia/Project.toml
          git commit -m 'chore: update dependencies [skip ci]' || echo "No changes to commit"
          git push origin || echo "No changes to push"

      # ── Render (shared composite action: temp dir, Julia and
      # parallel pre-renders, skill ZIP, babelquarto + retry, zh
      # post-processing) ────────────────────────────────────────
      - name: Render site
        uses: ./.github/actions/render-site
        with:
          has_changes: ${{ steps.changes.outputs.has_changes }}
          changed_qmds: ${{ steps.changes.outputs.changed_qmds }}
          render_julia: ${{ steps.setup-env.outputs.julia-ready }}
          lib_path: ${{ steps.setup-env.outputs.lib-path }}
          tmp_dir: ${{ env.TMP_DIR }}

      # ── Save freeze cache (ALWAYS – even on failure) ─────────
      # This is the key to reducing wasted work across consecutive
      # failed builds. Even if the render fails on file #400,
      # files #1-#399 have their freeze saved for the next run.
      - name: Save freeze cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: _freeze
          key: freeze-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}

      # ── Deploy ───────────────────────────────────────────────
      # Official actions/deploy-pages flow: package _site as the
      # github-pages artifact, then deploy it straight to the
      # github-pages environment.  This replaces quarto publish --target
      # gh-pages, which pushed the entire site to the gh-pages branch on
      # every deploy (~493 MB per push, the main driver of repository
      # growth tracked in issue #306).
      - name: Drop source maps from deploy artifact
        run: |
          MAP_SIZE=$(find _site -name "*.map" -exec du -ck {} + | tail -1 | cut -f1)
          find _site -name "*.map" -delete
          echo "Removed ${MAP_SIZE} kB of .map files from the deploy artifact"

      - name: Upload Quarto artifacts
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages

      - name: Cleanup temporary directory
        if: always()
        run: |
          TMP_PATH="${{ env.TMP_DIR }}"
          if [ -n "$TMP_PATH" ] && [[ "$TMP_PATH" =~ ^/mnt/TMP ]] && [ -d "$TMP_PATH" ]; then
            sudo rm -rf "$TMP_PATH" || echo "Warning: cleanup of $TMP_PATH failed (non-critical)"
            echo "Removed $TMP_PATH directory"
          else
            echo "Skipping cleanup - validation failed (path: $TMP_PATH)"
          fi

  # deploy-pages requires the deployment job to target the github-pages
  # environment. The environment's protection rules only allow deployments
  # from main-context runs, so deployment is a separate job that never runs
  # on pull_request events (where the ref is refs/pull/<n>/merge).
  deploy:
    if: github.event_name != 'pull_request'
    needs: build-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy-${{ github.workflow }}
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
