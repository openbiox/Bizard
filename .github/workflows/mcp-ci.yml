name: MCP CI

on:
  pull_request:
    paths:
      - 'mcp/**'
      - '.github/scripts/bundle_lib.py'
      - '.github/scripts/build-bundle.py'
  push:
    branches: [main, master]
    paths:
      - 'mcp/**'
      - '.github/scripts/bundle_lib.py'
      - '.github/scripts/build-bundle.py'

permissions:
  contents: read

jobs:
  bundle-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install pytest
      - name: Python bundle tests
        run: python3 -m pytest .github/scripts/tests -v
      - name: Build bundle
        run: |
          python3 .github/scripts/build-bundle.py --out /tmp/bundle
          test -s /tmp/bundle/bundle.json

  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
        working-directory: mcp
      - run: npm test
        working-directory: mcp
      - run: npm run coverage
        working-directory: mcp
      - name: Enforce 80% coverage
        working-directory: mcp
        run: |
          node -e "
          const c = require('./coverage/coverage-summary.json');
          const t = c.total.statements.pct;
          console.log('statements:', t);
          if (t < 80) { console.error('coverage below 80%'); process.exit(1); }
          "

  stdio-smoke:
    runs-on: ubuntu-latest
    needs: [node-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: '22' }
      - run: npm ci && npm run build
        working-directory: mcp
      - name: Build content snapshot
        run: python3 .github/scripts/build-bundle.py --out mcp/src/snapshot
      - name: Smoke test stdio server (initialize + tools/list)
        working-directory: mcp
        run: |
          node -e "
          const { spawn } = require('child_process');
          const p = spawn('node', ['dist/index.js']);
          const msg = JSON.stringify({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2025-06-18',capabilities:{},clientInfo:{name:'smoke',version:'0'}}}) + '\n';
          p.stdout.on('data', (d) => { if (String(d).includes('serverInfo')) { console.log('OK', String(d).slice(0,120)); p.kill(); process.exit(0); } });
          p.stderr.on('data', (d) => process.stderr.write(d));
          p.stdin.write(msg);
          setTimeout(() => { console.error('no response'); p.kill(); process.exit(1); }, 10000);
          "
