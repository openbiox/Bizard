name: PR review comments

# Companion to pr-review.yml. That workflow runs on the safe
# `pull_request` event, where the token is read-only for fork PRs, so the
# PR comments that need a writable token are posted here. This workflow
# reacts to the completion of "Render the new Quarto files" in the
# trusted default-branch context and NEVER checks out PR code — it only
# downloads artifacts produced by the pr-review workflow and posts
# comments.

on:
  workflow_run:
    workflows: [Render the new Quarto files]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  post-comments:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Post format check and render preview comments
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const os = require('os');
            const path = require('path');
            const { execSync } = require('child_process');

            const run = context.payload.workflow_run;

            // ── Artifacts produced by the pr-review run ───────────────────
            const { data: artifactList } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              run_id: run.id,
            });
            const artifacts = artifactList.artifacts || [];
            const formatSummary = artifacts.find(a => a.name === 'format-summary');
            const renderedFiles = artifacts.find(a => a.name === 'quarto-rendered-files');

            // ── Download the format summary artifact (trusted content: it
            //    is generated by pr-review.yml's API-only validation job) ──
            let prNumber = run.pull_requests[0]?.number;
            let formatComment = null;
            if (formatSummary) {
              // Extract into a fresh empty directory; the archive is only
              // ever read as text, never executed.
              const extractDir = fs.mkdtempSync(path.join(os.tmpdir(), 'pr-review-summary-'));
              const zipPath = path.join(extractDir, 'summary.zip');
              const download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                artifact_id: formatSummary.id,
                archive_format: 'zip',
              });
              fs.writeFileSync(zipPath, Buffer.from(download.data));
              execSync(`unzip -o '${zipPath}' -d '${extractDir}'`, { stdio: 'ignore' });

              const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap(e => {
                const p = path.join(dir, e.name);
                return e.isDirectory() ? walk(p) : [p];
              });
              const files = walk(extractDir);

              const prFile = files.find(p => p.endsWith('/pr-number'));
              if (prFile) prNumber = parseInt(fs.readFileSync(prFile, 'utf8').trim(), 10) || prNumber;
              const commentFile = files.find(p => p.endsWith('/format-comment.md'));
              if (commentFile) formatComment = fs.readFileSync(commentFile, 'utf8');
            }

            if (!prNumber) {
              console.log('No associated pull request; nothing to comment on.');
              return;
            }

            // ── 1. Format check comment ───────────────────────────────────
            if (!formatComment) {
              formatComment = run.conclusion === 'success'
                ? '## ✅ QMD Format Check\n\nFormat check completed. See the [workflow run](' + run.html_url + ') for details.\n'
                : '## ❌ QMD Format Check\n\nThe format check workflow failed. See the [workflow run](' +
                  run.html_url + ') for details.\n';
            } else if (run.conclusion === 'failure') {
              formatComment += '\n> ⚠️ The workflow finished with failures; some checks may be incomplete. ' +
                `See the [workflow run](${run.html_url}).`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: prNumber,
              body: formatComment,
            });

            // ── 2. Render preview notice (only when output was produced) ──
            if (run.conclusion !== 'success' || !renderedFiles) {
              console.log('No rendered-files artifact; nothing to preview.');
              return;
            }

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });
            const changedFiles = files
              .filter(f => f.filename.toLowerCase().endsWith('.qmd') && f.status !== 'removed')
              .map(f => f.filename)
              .join('\n');

            const preview = previewComment(changedFiles, run);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: prNumber,
              body: preview,
            });

            function previewComment(changed, runInfo) {
              // Built line-by-line so the template stays inside the YAML block scalar.
              return [
                '## 📊 Quarto Render Preview',
                '',
                'The new or modified Quarto files have been rendered and are available as artifacts.',
                '',
                `**🔗 [View and Download Rendered Files](${runInfo.html_url})**`,
                '',
                'Click the link above, scroll to the "Artifacts" section at the bottom of the page, and download `quarto-rendered-files` to preview the rendered HTML files.',
                '',
                '**Modified files:**',
                '```',
                changed,
                '```',
              ].join('\n');
            }
