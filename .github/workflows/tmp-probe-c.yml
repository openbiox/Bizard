name: CI probe C

# TEMPORARY diagnostic (remove after bisect).

on:
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: 347,
                body: '🔍 probe D (issues:write + pull-requests:write) — comment on MERGED PR 347',
              });
              core.info('347 comment: OK');
            } catch (e) {
              core.warning('347 comment FAILED: ' + e.status + ' ' + e.message);
            }
