# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Nightly / Manual Full Render and Freeze Cache Update               ║
# ║                                                                      ║
# ║  Purpose: Ensure the freeze cache is comprehensive and up-to-date.  ║
# ║  - Restores existing freeze cache (no longer deletes it)            ║
# ║  - Pre-renders ALL non-frozen QMD files (populates workspace        ║
# ║    _freeze BEFORE babelquarto runs, so the saved cache is full)     ║
# ║  - Renders the full site via babelquarto (pandoc-only, fast)        ║
# ║  - Adds Julia support                                                ║
# ║  - Saves updated freeze cache (even on failure)                      ║
# ║  - Optional: force full rebuild via manual dispatch                  ║
# ╚══════════════════════════════════════════════════════════════════════╝

on:
  workflow_dispatch:
    inputs:
      force_full_rebuild:
        description: 'Force full rebuild (delete freeze cache and re-execute all files)'
        type: boolean
        default: false
  schedule:
    # Run weekly (Monday 01:23 UTC) to update the freeze cache.
    # Reduced from daily: the full render takes hours and the freeze cache
    # rarely changes between weekly refreshes.
    - cron: '23 1 * * 1'

name: Render and Deploy Website and Update Freeze Cache

env:
  RUST_BACKTRACE: 1

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # Use a dedicated concurrency group so nightly builds do NOT share the
    # same group as the main "Github Page" push workflow.  The main workflow
    # has cancel-in-progress: true; if they shared a group, every push to
    # main would cancel any in-progress nightly build before it could save
    # the freeze cache.
    concurrency:
      group: quarto-build-nightly-cache-update
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TMP_DIR: /mnt/TMP
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ── Restore freeze cache ─────────────────────────────────
      # Restore the latest available freeze cache.  The primary key uses the
      # same prefix as the main workflow ("freeze-<OS>-") so both workflows
      # share the same cache pool.
      - name: Restore freeze cache
        id: freeze-restore
        if: inputs.force_full_rebuild != true
        uses: actions/cache/restore@v6
        with:
          path: _freeze
          key: freeze-${{ runner.os }}-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            freeze-${{ runner.os }}-nightly-
            freeze-${{ runner.os }}-

      - name: Clear freeze for forced full rebuild
        if: inputs.force_full_rebuild == true
        run: |
          rm -rf _freeze
          echo "🗑️ Freeze cache cleared – full rebuild will execute all files"

      - name: Report freeze cache status
        run: |
          if [ -d "_freeze" ]; then
            FREEZE_COUNT=$(find _freeze -name "*.json" -type f 2>/dev/null | wc -l)
            echo "✅ Freeze cache available: $FREEZE_COUNT frozen output(s)"
          else
            echo "⚠️ No freeze cache – full execution required"
          fi

      # ── Render environment (shared composite action) ─────────
      # Nightly renders everything unconditionally, so the action
      # defaults (need_julia='true', julia_frozen='0') reproduce the
      # original always-on Julia setup.
      - name: Set up render environment
        id: setup-env
        uses: ./.github/actions/setup-render-env
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      # ── Dependency Scanning ──────────────────────────────────
      - name: Scan and update dependencies
        run: |
          Rscript update-dependencies.R
          python manage-dependencies.py --update

      # The scan above may append QMD-discovered install-call packages to
      # DESCRIPTION that are newer than renv.lock; delta-install just the
      # difference before rendering.  See quarto-publish.yml for detail.
      - name: Install scan-added dependencies (delta)
        run: |
          Rscript - <<'RS'
          dcf <- read.dcf("DESCRIPTION")
          imports <- if ("Imports" %in% colnames(dcf)) {
            x <- trimws(strsplit(dcf[1, "Imports"], ",")[[1]])
            gsub("\\(.*$", "", x)
          } else character(0)
          imports <- setdiff(imports[imports != "" & imports != "R"], "R")
          missing <- imports[!vapply(imports, function(p)
            requireNamespace(p, quietly = TRUE), logical(1))]
          if (length(missing) == 0) {
            message("All Imports loadable - no delta install needed.")
          } else {
            message("Delta-installing: ", paste(missing, collapse = ", "))
            # renv's autoloader (renv::load()) replaced .libPaths() with the
            # project library only, hiding pak from R_LIBS_USER — bootstrap
            # it into the (writable) project library if missing, same
            # pattern as ci-benchmark.yml (PPM binary, ~seconds).
            if (!requireNamespace("pak", quietly = TRUE))
              install.packages("pak")
            pak::pak(missing)
          }
          RS

      - name: Commit updated dependency files
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add DESCRIPTION requirements.txt Julia/Project.toml
          git commit -m 'chore: update dependencies [skip ci]' || echo "No changes to commit"
          git push origin || echo "No changes to push"

      - name: Check disk usage before rendering
        run: |
          echo "=== Initial Disk Usage ==="
          df -h

      # ── Render (shared composite action) ─────────────────────
      - name: Render site
        uses: ./.github/actions/render-site
        with:
          render_julia: ${{ steps.setup-env.outputs.julia-ready }}
          lib_path: ${{ steps.setup-env.outputs.lib-path }}
          tmp_dir: ${{ env.TMP_DIR }}

      - name: Check disk usage after rendering
        run: |
          echo "=== Final Disk Usage ==="
          df -h

      # ── Save freeze cache (ALWAYS – even on failure) ─────────
      # Use the same "freeze-<OS>-" prefix as the main workflow so that the
      # main workflow's restore-keys can find this nightly-built cache.
      # The weekly date in the key limits cache growth to ~7 entries (GitHub
      # evicts cache entries unused for more than 7 days).  The run_attempt
      # suffix makes each attempt within a week a distinct immutable entry.
      - name: Get weekly date for cache key
        id: date
        run: echo "week=$(date -u +'%Y-W%V')" >> "$GITHUB_OUTPUT"

      - name: Save freeze cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: _freeze
          key: freeze-${{ runner.os }}-nightly-${{ steps.date.outputs.week }}-${{ github.run_attempt }}

      # Also save under the shared prefix so both the main workflow and the
      # next nightly run can restore from it via the "freeze-<OS>-" prefix.
      - name: Save freeze cache (shared key)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: _freeze
          key: freeze-${{ runner.os }}-nightly-${{ github.run_id }}

      # ── Deploy ───────────────────────────────────────────────
      # Official actions/deploy-pages flow: package _site as the
      # github-pages artifact, then deploy it straight to the
      # github-pages environment.  This replaces quarto publish --target
      # gh-pages, which pushed the entire site to the gh-pages branch on
      # every deploy (~493 MB per push, the main driver of repository
      # growth tracked in issue #306).
      - name: Drop source maps from deploy artifact
        run: |
          MAP_SIZE=$(find _site -name "*.map" -exec du -ck {} + | tail -1 | cut -f1)
          find _site -name "*.map" -delete
          echo "Removed ${MAP_SIZE} kB of .map files from the deploy artifact"

      - name: Upload Quarto artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

      - name: Cleanup temporary directory
        if: always()
        run: |
          TMP_PATH="${{ env.TMP_DIR }}"
          if [ -n "$TMP_PATH" ] && [[ "$TMP_PATH" =~ ^/mnt/TMP ]] && [ -d "$TMP_PATH" ]; then
            sudo rm -rf "$TMP_PATH"
            echo "Removed $TMP_PATH directory"
          else
            echo "Skipping cleanup - validation failed (path: $TMP_PATH)"
          fi

  # deploy-pages requires the deployment job to target the github-pages
  # environment. The environment's protection rules only allow deployments
  # from main-context runs, so deployment is a separate dedicated job.
  deploy:
    needs: build-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy-${{ github.workflow }}
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
