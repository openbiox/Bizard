name: CI probe A

# TEMPORARY diagnostic (remove after the workflow_run 403 bisect).
# Dispatch-only; posts one comment on closed PR #344 to test whether a
# plain `issues: write` token can comment on a PR issue number outside
# the workflow_run context.

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: 344,
              body: '🔍 probe A (workflow_dispatch, issues:write) — dispatch-context PR comment',
            });
            core.info('probe A comment posted');
