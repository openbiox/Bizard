# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Generate renv.lock (issue #306, item B1)                            ║
# ║                                                                      ║
# ║  Runs on every push to main that touches DESCRIPTION.  Installs      ║
# ║  every declared dependency (Imports + Suggests + Remotes) with pak   ║
# ║  via r-lib/actions/setup-r-dependencies – the exact installer the    ║
# ║  render workflows already use – snapshots the library to renv.lock,  ║
# ║  and opens a PR with the refreshed lockfile.                         ║
# ║                                                                      ║
# ║  Why pak instead of a hand-rolled installer: the first attempt       ║
# ║  (CI runs 38054639637 and 38057393508) failed on four fronts that    ║
# ║  pak solves out of the box:                                          ║
# ║    1. remotes::install_github(dependencies = FALSE) never installed  ║
# ║       the transitive CRAN deps of GitHub remotes (babelquarto,       ║
# ║       CellChat, ggalt, …);                                           ║
# ║    2. Remotes declared inside a dependency's own DESCRIPTION         ║
# ║       (scRNAtoolVis → junjunlab/jjPlot, sajuukLyu/ggunchull) were    ║
# ║       invisible to the flat install list;                            ║
# ║    3. hiplotlib's SSH submodule clone needs an SSH key runners       ║
# ║       don't have (rewritten to HTTPS below);                         ║
# ║    4. PPM binaries don't bundle every system library (e.g.           ║
# ║       libudunits2 behind units → sf), and the old final check used   ║
# ║       quietly = TRUE, so unloadable packages failed opaquely.        ║
# ║                                                                      ║
# ║  CI render jobs then use r-lib/actions/setup-renv with cache         ║
# ║  keyed on the lockfile hash, so package installs only rerun when     ║
# ║  the lockfile truly changes (issue #306 section 2.2).                ║
# ║                                                                      ║
# ║  The lockfile is validated against the exact PPM repository the      ║
# ║  render CI restores from before the PR is opened.  PRs created with  ║
# ║  GITHUB_TOKEN do not trigger pull_request workflows, so this check   ║
# ║  replaces PR CI for the generated lockfile: a package version that   ║
# ║  exists only on CRAN (ahead of PPM's sync) would otherwise fail the  ║
# ║  full restore after merge (PR #407).                                 ║
# ║                                                                      ║
# ║  The weekly schedule exists because pins go stale without any        ║
# ║  DESCRIPTION change: PPM's rolling index advances, a lockfile pin    ║
# ║  drops out of the index, and renv::restore() then resolves that      ║
# ║  exact version via crandb — whose JSON can carry corrupted dep       ║
# ║  keys (duplicate deps renamed "utils.1"), aborting the whole         ║
# ║  restore (run 40279900028, fixed by repinning partykit in PR         ║
# ║  #413).  Refreshing the lockfile weekly keeps pins current, so       ║
# ║  restore resolves from clean index metadata instead of crandb.       ║
# ╚══════════════════════════════════════════════════════════════════════╝

name: Generate renv.lock

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'DESCRIPTION'
      - '.github/workflows/generate-renv-lock.yml'
  schedule:
    # Weekly, ahead of the Monday 01:23 UTC full render: refresh stale
    # pins (PR with any changes; clean no-op when the lockfile is current).
    - cron: '23 21 * * 0'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-renv-lock
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_SANDBOX_ENABLED: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # hiplotlib carries a git submodule pointing at
      # git@github.com:hiplot/rscheduler.git; runners have no SSH key, so
      # rewrite every SSH GitHub URL to HTTPS before any clone happens.
      - name: Rewrite SSH git URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      # Same installer the render workflows use, so its behaviour is
      # already proven on this repo: pak resolves Imports + Suggests +
      # Remotes (recursively, including remotes-of-remotes) and installs
      # system requirements.  Cache stays off – the lockfile must reflect
      # a fresh resolution of the current DESCRIPTION, never a cached
      # library.
      - name: Install all dependencies (pak)
        uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: "true"
        with:
          cache: false
          packages: 'deps::., any::renv, any::jsonlite'

      # pak's dependency solve only installs LinkingTo packages when a
      # dependent package compiles from source; with PPM binaries nothing
      # does, so header-only packages (AsioHeaders, sitmo, …) never land
      # in the library and renv::snapshot() drops them from the lockfile.
      # Install the known LinkingTo-only set explicitly.
      - name: Install LinkingTo-only packages
        run: |
          Rscript - <<'RS'
          pkgs <- c("AsioHeaders", "RcppArmadillo", "RcppProgress",
                    "RcppThread", "sitmo")

          # Resolve from PPM only.  The default repos also include CRAN,
          # and install.packages() picks the newest version across both;
          # that pulled RcppArmadillo 15.6.2-1 from CRAN before PPM had
          # ingested it, producing a lockfile the PPM-restricted render
          # restore cannot install (PR #407).  RSPM is exported by
          # setup-r with use-public-rspm.
          repos <- Sys.getenv("RSPM")
          if (!nzchar(repos)) repos <- getOption("repos")

          missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing) > 0) {
            message("Installing LinkingTo-only packages: ",
                    paste(missing, collapse = ", "))
            install.packages(missing, repos = repos)
          }

          # BiocVersion is not served by CRAN/PPM for this R version; fetch
          # it from Bioconductor.  Non-fatal: the snapshot tolerates its
          # absence (it is a version-marker stub) – run 38104654296
          # produced a valid 676-package lockfile without it.
          if (!requireNamespace("BiocVersion", quietly = TRUE)) {
            if (!requireNamespace("BiocManager", quietly = TRUE)) {
              install.packages("BiocManager", repos = repos)
            }
            tryCatch(
              BiocManager::install("BiocVersion", ask = FALSE, update = FALSE),
              error = function(e) {
                message("BiocVersion install failed (non-fatal): ",
                        conditionMessage(e))
              }
            )
          }
          RS

      # Smoke-test that the locked packages actually LOAD.  Installing is
      # not enough: a missing system library surfaces only at load time,
      # and the previous silently-quiet requireNamespace() check turned
      # that into an opaque end-of-run failure.
      - name: Smoke-test package loading
        run: |
          Rscript - <<'RS'
          probe <- c(
            "babelquarto", "hiplotlib", "scRNAtoolVis", "CellChat",
            "RIdeogram", "sf", "ggspatial", "ggfx", "calendR",
            "ggalt", "cutoff", "ggmosaic", "CGPfunctions", "regplot",
            "smoother", "igraph", "ggtangle", "clusterProfiler", "magick"
          )
          failed <- character(0)
          for (p in probe) {
            ok <- tryCatch({ loadNamespace(p); TRUE },
                           error = function(e) {
                             message("LOAD FAILED ", p, ": ", conditionMessage(e))
                             FALSE
                           })
            if (!ok) failed <- c(failed, p)
          }
          if (length(failed) > 0) {
            stop("Packages installed but not loadable: ",
                 paste(failed, collapse = ", "))
          }
          message("All ", length(probe), " probe packages load cleanly.")
          RS

      # ── Prepare the PR branch from main ────────────────────────
      # Always rebuild ci/renv-lock-update from origin/main.  Reusing the
      # stale remote branch (its base predates main's renv.lock) produced
      # an add/add conflict on every regen; branching from main keeps the
      # PR a clean one-file delta.
      - name: Prepare lockfile branch
        run: |
          BRANCH="ci/renv-lock-update"
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

          git fetch origin main
          git checkout -B "$BRANCH" "origin/main"

      # ── Snapshot → renv.lock ───────────────────────────────────
      # The lockfile covers the full recursive closure of Imports +
      # Suggests (anything a QMD chunk may load at render time), plus
      # jsonlite tooling.  renv itself is deliberately NOT a lockfile
      # package: snapshotting it produced a Source=any self-entry
      # (RemotePkgRef "any::renv"), and when the setup-renv package
      # cache lacks that pinned binary, renv::restore() takes the
      # download path, mis-parses the entry's Imports vector and aborts
      # the whole restore with a bogus "package 'utils.1' is not
      # available" (run 40279900028).  The render workflows get the renv
      # tooling from r-lib/actions/setup-renv, which installs it into
      # the user library outside the lockfile.
      # Passing `packages` explicitly keeps renv
      # from crawling 500+ qmd files to discover dependencies; renv
      # still records the complete transitive closure of those roots.
      # `library` hands renv the full .libPaths(): a single-library view
      # is wrong in both directions – pak's library alone lost base and
      # recommended packages (MASS, Matrix, survival, … were snapshotted
      # out in run 38101269245), while renv's default project-scoped view
      # missed packages pak installed altogether (run 38098486650).
      - name: Generate renv.lock
        run: |
          Rscript - <<'RS'
          dcf <- read.dcf("DESCRIPTION")
          pkgs_from_field <- function(field) {
            if (!field %in% colnames(dcf)) return(character(0))
            x <- trimws(strsplit(dcf[1, field], ",")[[1]])
            x <- gsub("\\(.*$", "", x)
            x[nzchar(x) & x != "R"]
          }
          packages <- unique(c(
            pkgs_from_field("Imports"),
            pkgs_from_field("Suggests"),
            "jsonlite"
          ))

          # Every library on the search path – pak's library first, then
          # site/user, then R's base/recommended library – so nothing
          # installed is invisible to the snapshot.
          library <- .libPaths()

          # force = FALSE keeps renv's pre-flight validation: snapshot
          # aborts when a required dependency is missing from the library
          # or a version requirement is unsatisfied.  The previous
          # force = TRUE silently wrote an incomplete lockfile.
          renv::snapshot(
            project  = ".",
            lockfile = "renv.lock",
            packages = packages,
            library  = library,
            prompt   = FALSE,
            force    = FALSE
          )
          RS

      - name: Validate lockfile
        run: |
          Rscript -e '
            lock <- jsonlite::fromJSON("renv.lock")
            stopifnot(length(lock$Packages) > 100)
            cat("Locked packages:", length(lock$Packages), "\n")
            cat("R version:", lock$R$Version, "\n")'

      # The render workflows restore with RENV_CONFIG_REPOS_OVERRIDE set
      # to PPM by setup-r, so every locked repository package must be
      # served by that exact repo.  Check availability here — before the
      # PR is opened — because bot PRs do not run pull_request CI.
      # Base/recommended packages come from R itself and Bioconductor /
      # GitHub records use their own sources, so they are skipped.
      - name: Verify lockfile is restorable from PPM
        run: |
          Rscript - <<'RS'
          text <- function(x) if (is.null(x)) "" else x
          lock <- jsonlite::fromJSON("renv.lock")
          ppm <- sub("/+$", "", Sys.getenv("RENV_CONFIG_REPOS_OVERRIDE"))
          if (!nzchar(ppm)) {
            stop("RENV_CONFIG_REPOS_OVERRIDE is not set; cannot verify PPM availability")
          }

          standard <- rownames(installed.packages(priority = c("base", "recommended")))
          records <- Filter(function(r) {
            source <- text(r$Source)
            repo <- text(r$Repository)
            source %in% c("Repository", "any") &&
              nzchar(repo) &&
              !grepl("bioconductor", repo, ignore.case = TRUE) &&
              !r$Package %in% standard
          }, lock$Packages)

          idx <- available.packages(repos = ppm, type = "source")
          check_url <- function(url) {
            status <- suppressWarnings(system2(
              "curl",
              c("-sIL", "-o", "/dev/null", "-w", "%{http_code}",
                "--max-time", "30", shQuote(url)),
              stdout = TRUE, stderr = FALSE
            ))
            identical(tail(status, 1), "200")
          }

          failures <- character()
          archived <- 0L
          for (r in records) {
            pkg <- r$Package
            ver <- r$Version
            if (pkg %in% rownames(idx) &&
                identical(unname(idx[pkg, "Version"]), ver)) {
              next
            }
            urls <- c(
              sprintf("%s/src/contrib/%s_%s.tar.gz", ppm, pkg, ver),
              sprintf("%s/src/contrib/Archive/%s/%s_%s.tar.gz", ppm, pkg, pkg, ver)
            )
            if (any(vapply(urls, check_url, logical(1)))) {
              archived <- archived + 1L
            } else {
              failures <- c(failures, sprintf("%s %s", pkg, ver))
            }
          }

          message("PPM check: ", length(records), " repository packages; ",
                  archived, " served from the archive")
          if (length(failures) > 0) {
            stop(
              "PPM cannot serve these locked versions:\n  ",
              paste(failures, collapse = "\n  "),
              "\nWait for PPM to ingest the release, then re-run this workflow."
            )
          }
          message("All locked repository packages are available from ", ppm)
          RS

      # ── Open/update PR with the refreshed lockfile ─────────────
      - name: Create or update lockfile PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="ci/renv-lock-update"

          git add renv.lock
          if git diff --cached --quiet -- renv.lock; then
            echo "renv.lock unchanged – nothing to commit"
            exit 0
          fi

          git commit -m "chore: refresh renv.lock from DESCRIPTION [skip ci]"
          # The branch is always rebuilt from origin/main above, so its
          # history is disjoint from whatever the remote branch holds; a
          # plain push is rejected non-fast-forward (run 38101269245).
          git push --force origin "$BRANCH"

          if gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' | grep -q .; then
            echo "PR already open – pushed update"
          else
            gh pr create \
              --base main --head "$BRANCH" \
              --title "chore: refresh renv.lock" \
              --body "Automated B1 lockfile refresh from \`DESCRIPTION\`.

          Changes to \`DESCRIPTION\` (Imports/Remotes) trigger regeneration so the
          render CI can key its cache on this file.

          The lockfile is checked against the PPM repository render CI restores
          from before this PR is opened.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          fi
